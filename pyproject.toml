[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tathya"
version = "1.0.0"
description = "Uncover the truth of your dataset before you train — automated structure, health, and leakage audit."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tathya Contributors" }
]
keywords = [
    "computer-vision",
    "dataset",
    "eda",
    "data-quality",
    "machine-learning",
    "image-processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
baseline = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
tathya = "tathya.cli:main"
dataset-detective = "tathya.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tathya*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

